[project]
name = "clauseguard"
version = "0.1.0"
description = "Enterprise-grade contract analysis AI with zero-hallucination pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "groq",
    "python-multipart",
    "pdfplumber",
    "python-docx"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "src.api:app"
